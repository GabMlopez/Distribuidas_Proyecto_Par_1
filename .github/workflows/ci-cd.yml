name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'development/*'
  pull_request:
    branches:
      - main

jobs:
  backend-test-build:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    
    # Podemos necesitar Redis y MongoDB para las pruebas de integración del backend
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Run Go Tests
        env:
          MONGODB_URI: mongodb://localhost:27017/chat_distribuido_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_ADMIN: test_admin_secret
          JWT_SECRET_USER: test_user_secret
        run: go test -v -coverprofile=coverage.out ./...

      - name: Build Go Application
        run: go build -o main .

      - name: Upload Go Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-executable
          path: main

  frontend-test-build:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend-next

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true # No bloqueamos si hay warnings menores de lint

      - name: Run Frontend Tests
        run: npm run test

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  deploy:
    name: Deploy to Production
    needs: [backend-test-build, frontend-test-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Info
        run: echo "CI tests passed. Deployment is handled automatically by Render (Backend) and Vercel (Frontend) via GitHub integrations."
      
      # Si se tuviera un Webhook de Render explícito, se podría llamar aquí:
      # - name: Trigger Render Deploy
      #   if: env.RENDER_DEPLOY_HOOK != ''
      #   run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
