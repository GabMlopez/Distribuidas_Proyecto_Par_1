services:
  # Backend API
  - type: web
    name: chat-backend
    runtime: image
    repo: https://github.com/GabMlopez/Distribuidas_Proyecto_Par_1
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8085
      - key: GIN_MODE
        value: release
      - key: MONGODB_URI
        sync: false  # Configurar manualmente en Render Dashboard
      - key: REDIS_URL
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: chat-uploads
      - key: MINIO_USE_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: MAX_FILE_SIZE
        value: 10485760
    healthCheckPath: /health
    domains:
      - chat-api.onrender.com
  - type: web
    name: minio
    runtime: image
    repo: https://github.com/render-examples/minio
    plan: starter
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MINIO_ROOT_USER
        value: minioadmin # O usa sync: false para ponerlo manualmente
      - key: MINIO_ROOT_PASSWORD
        generateValue: true
    disks:
      - name: minio-data
        mountPath: /data
        sizeGB: 10

  # Servicio de la Consola Web de MinIO (Opcional)
  - type: web
    name: minio-console
    runtime: image
    repo: https://github.com/render-examples/minio
    plan: starter
    dockerContext: .
    dockerfilePath: ./Dockerfile.console
    envVars:
      - key: MINIO_SERVER_URL
        value: https://minio.onrender.com # La URL de tu servicio API
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false