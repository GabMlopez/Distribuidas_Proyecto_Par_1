version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: chat_mongodb_v2
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=chat_distribuido
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: chat_redis_v2
    ports:
      - "6380:6379"
    restart: unless-stopped

volumes:
  mongodb_data:
