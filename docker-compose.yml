version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: chat_mongodb_v2
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=chat_distribuido
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: chat_redis_v2
    ports:
      - "6380:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: chat_minio_v2
    ports:
      - "9191:9191"
      - "9292:9292"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    volumes:
      - minio_data:/data
    command: server /data --address ":9191" --console-address ":9292"
    restart: unless-stopped

volumes:
  mongodb_data:
  minio_data:
